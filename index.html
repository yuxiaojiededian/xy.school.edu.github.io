<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模拟有性生殖 · 八年级下册</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #f5f9ff 0%, #e6f0fa 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 10px;
            overflow-x: auto;
        }
        .experiment-container {
            width: 98vw;
            max-width: 1600px;
            min-width: 1000px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(8px);
            border-radius: 36px;
            box-shadow: 0 25px 40px -12px rgba(0, 20, 40, 0.35), inset 0 1px 4px rgba(255, 255, 255, 0.8);
            padding: 20px 30px 24px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            position: relative;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 500;
            color: #1e3b5c;
            margin: 0 0 6px 0;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        h1 span {
            background: #2b5a8c;
            color: white;
            font-size: 0.9rem;
            padding: 4px 16px;
            border-radius: 40px;
            font-weight: 400;
            letter-spacing: 2px;
        }
        .subhead {
            color: #3f5e7c;
            margin: 0 0 14px 0;
            font-size: 0.95rem;
            border-left: 4px solid #7aa5c7;
            padding-left: 14px;
            font-style: italic;
        }
        .dishes {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin: 10px 0 18px;
            padding: 0 6px;
        }
        .dish-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }
        .dish-label {
            font-weight: 500;
            color: #1f4970;
            background: rgba(255, 255, 255, 0.6);
            padding: 5px 20px;
            border-radius: 100px;
            border: 1px solid #bfd9f0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            font-size: 0.95rem;
            white-space: nowrap;
        }
        .dish-pair {
            display: flex;
            gap: 24px;
            justify-content: center;
            flex-wrap: nowrap;
        }
        /* 圆盘：grid 布局，格子尺寸缩小，容纳更多染色体 */
        .dish {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: #dfeaf5;
            box-shadow: 0 10px 16px -6px rgba(30, 60, 90, 0.25), inset 0 0 0 2px rgba(255,255,255,0.8), inset 0 0 18px rgba(80, 120, 160, 0.2);
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-auto-rows: 26px;
            gap: 1px;
            justify-items: center;
            align-items: center;
            padding: 12px 8px;
            transition: box-shadow 0.3s;
            position: relative;
            border: 1px solid #ffffff;
            overflow: hidden;
            flex-shrink: 0;
        }
        .dish.father {
            background: #c8dff5;
        }
        .dish.mother {
            background: #f5d7e6;
        }
        .dish.zygote {
            width: 200px;
            height: 200px;
            background: #ffe8b6;
            box-shadow: 0 14px 24px -8px #b38b5b60, inset 0 0 0 3px #ffeac2, inset 0 0 24px #dbb47a40;
            border: 1px solid #f5e3b0;
            grid-template-columns: repeat(5, 1fr);
            grid-auto-rows: 28px;
            gap: 2px;
            padding: 14px 10px;
        }

        /* 染色体：缩小到 22×26，每个格子能放得下 */
        .chromosome {
            width: 22px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
            will-change: transform, opacity;
            line-height: 0;
        }
        .chromosome svg {
            display: block;
            width: 22px;
            height: 26px;
            overflow: visible;
        }
        .chromosome:hover svg {
            filter: brightness(1.15);
        }

        .highlight {
            box-shadow: 0 0 0 4px #f9e56c, 0 12px 24px -6px #7a6a2e50 !important;
        }

        .btn-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 2px dashed #b9d2e7;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .btn {
            background: #ffffffea;
            border: 1px solid #aac4dd;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #1a3e60;
            cursor: pointer;
            box-shadow: 0 6px 12px -6px #2f527330, 0 1px 3px #ffffff80 inset;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .btn:hover {
            background: #ffffff;
            border-color: #6d9ac2;
            box-shadow: 0 10px 18px -8px #1e3f5e50;
            transform: translateY(-1px);
        }
        .btn:active {
            transform: translateY(1px);
            box-shadow: 0 3px 6px -4px #2f5273;
        }
        .btn.primary {
            background: #2b5a8c;
            color: white;
            border-color: #1d3f60;
            box-shadow: 0 10px 16px -8px #1a3650;
        }
        .btn.primary:hover {
            background: #1f4a78;
        }
        .btn.secondary {
            background: #f1f7fe;
        }
        .btn:disabled {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(0.4);
        }
        .data-hint {
            font-size: 0.9rem;
            color: #3b5e7e;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .speech-overlay {
            position: fixed;
            bottom: 8%;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            pointer-events: none;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .speech-overlay.show {
            opacity: 1;
        }
        .speech-text {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            padding: 16px 34px;
            border-radius: 80px;
            font-family: 'Microsoft YaHei', sans-serif;
            font-size: 1.4rem;
            font-weight: 500;
            color: #1e3b5c;
            letter-spacing: 2px;
            box-shadow: 0 20px 35px -8px #1f3b5840, 0 0 0 1px #ffffffd0 inset;
            border: 1px solid #d1e3f5;
            text-align: center;
            line-height: 1.5;
            white-space: nowrap;
            overflow: hidden;
            max-width: 90vw;
            text-overflow: ellipsis;
        }
        .speech-text.fade-out {
            animation: fadeOutWhite 2.5s forwards;
        }
        @keyframes fadeOutWhite {
            0% { opacity: 1; transform: scale(1); background: #ffffff; color: #1e3b5c; }
            70% { opacity: 1; transform: scale(1.02); background: #ffffff; color: #1e3b5c; }
            100% { opacity: 0; transform: scale(1.08); background: #ffffff; color: #ffffff; }
        }
        .small-note {
            font-size: 0.8rem;
            color: #6d8aa8;
            margin-top: 6px;
            text-align: right;
        }
        .flying-chromosome {
            position: fixed;
            z-index: 1000;
            pointer-events: none;
            transition: all 2.2s cubic-bezier(0.35, 0.05, 0.25, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .flying-chromosome .chromosome {
            width: 22px;
            height: 26px;
        }
        .flying-chromosome .chromosome svg {
            width: 22px;
            height: 26px;
        }

        @media (max-width: 1100px) {
            body {
                justify-content: flex-start;
            }
            .experiment-container {
                min-width: 1000px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>

<div class="experiment-container" id="app">
    <h1>🧬 模拟有性生殖 <span>八年级下册</span></h1>
    <div class="subhead">父本 · 母本 · 受精卵 (染色体随机组合)</div>

    <div class="dishes" id="dishesContainer">
        <div class="dish-group">
            <div class="dish-label">父方 (2个圆盘)</div>
            <div class="dish-pair">
                <div class="dish father" id="fatherDish1"></div>
                <div class="dish father" id="fatherDish2"></div>
            </div>
        </div>

        <div class="dish-group">
            <div class="dish-label">母方 (2个圆盘)</div>
            <div class="dish-pair">
                <div class="dish mother" id="motherDish1"></div>
                <div class="dish mother" id="motherDish2"></div>
            </div>
        </div>

        <div class="dish-group">
            <div class="dish-label">受精卵</div>
            <div class="dish zygote" id="zygoteDish"></div>
        </div>
    </div>

    <div class="btn-bar">
        <div class="btn-group">
            <button class="btn primary" id="animateBtn">▶ 开始实验动画</button>
            <button class="btn secondary" id="downloadXlsxBtn">⬇ 下载数据 (XLSX)</button>
            <button class="btn secondary" id="downloadCsvBtn">⬇ 下载 CSV</button>
            <button class="btn secondary" id="downloadTxtBtn">⬇ 下载 TXT</button>
        </div>
        <div class="data-hint">
            <span>🧬 24对染色体 · 随机生成</span>
        </div>
    </div>
    <div class="small-note">* 点击动画演示一次完整受精过程，后续数据已填入表格。</div>
</div>

<div class="speech-overlay" id="speechOverlay">
    <div class="speech-text" id="speechText"></div>
</div>

<script>
    (function() {
        // ========== 伪随机与镝增算法 ==========
        let seed = Date.now() + Math.random() * 1000000;
        function random() {
            seed = (seed * 9301 + 49297) % 233280;
            return seed / 233280;
        }
        function reseed() {
            seed = Date.now() + Math.random() * 1000000 + performance.now();
        }

        let chromosomeData = [];

        function generateRandomChromosomeData() {
            reseed();
            const rows = [];
            rows.push(['染色体对', '父方染色体1', '父方染色体2', '母方染色体1', '母方染色体2', '受精卵染色体1', '受精卵染色体2']);
            
            for (let i = 0; i < 24; i++) {
                let father1, father2, mother1, mother2;
                if (i < 22) {
                    father1 = 'A'; father2 = 'A';
                    mother1 = 'A'; mother2 = 'A';
                } else if (i === 22) {
                    father1 = 'X'; father2 = 'Y';
                    mother1 = 'X'; mother2 = 'X';
                } else {
                    father1 = 'A'; father2 = 'A';
                    mother1 = 'A'; mother2 = 'A';
                }
                const zygoteFromFather = random() < 0.5 ? father1 : father2;
                const zygoteFromMother = random() < 0.5 ? mother1 : mother2;
                rows.push([
                    `第${i+1}对`,
                    father1, father2,
                    mother1, mother2,
                    zygoteFromFather, zygoteFromMother
                ]);
            }
            return rows;
        }

        let fatherDish1Chrom = [], fatherDish2Chrom = [], motherDish1Chrom = [], motherDish2Chrom = [], zygoteChrom = [];

        function fillDishesRandom() {
            const fatherDish1 = [];
            const fatherDish2 = [];
            const motherDish1 = [];
            const motherDish2 = [];
            
            // 性染色体放在最前面
            if (random() < 0.5) {
                fatherDish1.push({ type: 'X', label: 'X' });
                fatherDish2.push({ type: 'Y', label: 'Y' });
            } else {
                fatherDish1.push({ type: 'Y', label: 'Y' });
                fatherDish2.push({ type: 'X', label: 'X' });
            }
            motherDish1.push({ type: 'X', label: 'X' });
            motherDish2.push({ type: 'X', label: 'X' });
            
            for (let i = 0; i < 14; i++) {
                fatherDish1.push({ type: 'autosome', label: 'A' });
                fatherDish2.push({ type: 'autosome', label: 'A' });
                motherDish1.push({ type: 'autosome', label: 'A' });
                motherDish2.push({ type: 'autosome', label: 'A' });
            }

            const f1Autosomes = fatherDish1.slice(1);
            const f2Autosomes = fatherDish2.slice(1);
            const m1Autosomes = motherDish1.slice(1);
            const m2Autosomes = motherDish2.slice(1);
            shuffleArray(f1Autosomes);
            shuffleArray(f2Autosomes);
            shuffleArray(m1Autosomes);
            shuffleArray(m2Autosomes);
            
            return { 
                fatherDish1: [fatherDish1[0], ...f1Autosomes],
                fatherDish2: [fatherDish2[0], ...f2Autosomes],
                motherDish1: [motherDish1[0], ...m1Autosomes],
                motherDish2: [motherDish2[0], ...m2Autosomes]
            };
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
        }

        // ========== 创建染色体 SVG（缩小版 22×26） ==========
        function createChromosomeElement(type) {
            const wrapper = document.createElement('div');
            wrapper.className = 'chromosome ' + type;

            const svgNS = 'http://www.w3.org/2000/svg';
            const svg = document.createElementNS(svgNS, 'svg');
            svg.setAttribute('width', '22');
            svg.setAttribute('height', '26');
            svg.setAttribute('viewBox', '0 0 22 26');
            svg.style.overflow = 'visible';

            if (type === 'X') {
                // X 形：两条交叉线，交叉点约在 (11, 13)
                const l1 = document.createElementNS(svgNS, 'line');
                l1.setAttribute('x1', '4');
                l1.setAttribute('y1', '3');
                l1.setAttribute('x2', '18');
                l1.setAttribute('y2', '23');
                l1.setAttribute('stroke', '#d4458a');
                l1.setAttribute('stroke-width', '3.5');
                l1.setAttribute('stroke-linecap', 'round');

                const l2 = document.createElementNS(svgNS, 'line');
                l2.setAttribute('x1', '18');
                l2.setAttribute('y1', '3');
                l2.setAttribute('x2', '4');
                l2.setAttribute('y2', '23');
                l2.setAttribute('stroke', '#d4458a');
                l2.setAttribute('stroke-width', '3.5');
                l2.setAttribute('stroke-linecap', 'round');

                svg.appendChild(l1);
                svg.appendChild(l2);
            } else if (type === 'Y') {
                // Y 形：底部交汇于 (11, 23)，向上分叉到 (4,3) 和 (18,3)
                const l1 = document.createElementNS(svgNS, 'line');
                l1.setAttribute('x1', '11');
                l1.setAttribute('y1', '23');
                l1.setAttribute('x2', '4');
                l1.setAttribute('y2', '3');
                l1.setAttribute('stroke', '#2a72b8');
                l1.setAttribute('stroke-width', '3.5');
                l1.setAttribute('stroke-linecap', 'round');

                const l2 = document.createElementNS(svgNS, 'line');
                l2.setAttribute('x1', '11');
                l2.setAttribute('y1', '23');
                l2.setAttribute('x2', '18');
                l2.setAttribute('y2', '3');
                l2.setAttribute('stroke', '#2a72b8');
                l2.setAttribute('stroke-width', '3.5');
                l2.setAttribute('stroke-linecap', 'round');

                svg.appendChild(l1);
                svg.appendChild(l2);
            } else {
                // 常染色体：两条平行竖线
                const l1 = document.createElementNS(svgNS, 'line');
                l1.setAttribute('x1', '8');
                l1.setAttribute('y1', '3');
                l1.setAttribute('x2', '8');
                l1.setAttribute('y2', '23');
                l1.setAttribute('stroke', '#5f9e5f');
                l1.setAttribute('stroke-width', '3.5');
                l1.setAttribute('stroke-linecap', 'round');

                const l2 = document.createElementNS(svgNS, 'line');
                l2.setAttribute('x1', '14');
                l2.setAttribute('y1', '3');
                l2.setAttribute('x2', '14');
                l2.setAttribute('y2', '23');
                l2.setAttribute('stroke', '#5f9e5f');
                l2.setAttribute('stroke-width', '3.5');
                l2.setAttribute('stroke-linecap', 'round');

                svg.appendChild(l1);
                svg.appendChild(l2);
            }

            wrapper.appendChild(svg);
            return wrapper;
        }

        function renderDish(element, chromosomes) {
            if (!element) return;
            element.innerHTML = '';
            // grid 布局 5列，最多显示 25 个
            const displayList = chromosomes.slice(0, 25);
            displayList.forEach(ch => {
                const chrEl = createChromosomeElement(ch.type);
                element.appendChild(chrEl);
            });
        }

        function renderAll() {
            renderDish(document.getElementById('fatherDish1'), fatherDish1Chrom);
            renderDish(document.getElementById('fatherDish2'), fatherDish2Chrom);
            renderDish(document.getElementById('motherDish1'), motherDish1Chrom);
            renderDish(document.getElementById('motherDish2'), motherDish2Chrom);
            renderDish(document.getElementById('zygoteDish'), zygoteChrom);
        }

        // ========== 动画核心 ==========
        let animating = false;

        function getCenter(el) {
            const rect = el.getBoundingClientRect();
            return { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
        }

        function createFlyingChromosome(type, startX, startY) {
            const div = document.createElement('div');
            div.className = 'flying-chromosome';
            div.style.left = startX + 'px';
            div.style.top = startY + 'px';
            div.style.position = 'fixed';

            const chrEl = createChromosomeElement(type);
            div.appendChild(chrEl);

            document.body.appendChild(div);
            return div;
        }

        async function performRealisticAnimation() {
            if (animating) return;
            animating = true;
            const animateBtn = document.getElementById('animateBtn');
            animateBtn.disabled = true;

            zygoteChrom = [];
            renderDish(document.getElementById('zygoteDish'), zygoteChrom);

            const father1 = document.getElementById('fatherDish1');
            const father2 = document.getElementById('fatherDish2');
            const mother1 = document.getElementById('motherDish1');
            const mother2 = document.getElementById('motherDish2');
            const zygote = document.getElementById('zygoteDish');

            father1.classList.add('highlight');
            father2.classList.add('highlight');
            mother1.classList.add('highlight');
            mother2.classList.add('highlight');

            let fatherSelected1 = fatherDish1Chrom[0] || { type: 'X', label: 'X' };
            let fatherSelected2 = fatherDish2Chrom[0] || { type: 'Y', label: 'Y' };
            let motherSelected1 = motherDish1Chrom[0] || { type: 'X', label: 'X' };
            let motherSelected2 = motherDish2Chrom[0] || { type: 'X', label: 'X' };

            const f1Center = getCenter(father1);
            const f2Center = getCenter(father2);
            const m1Center = getCenter(mother1);
            const m2Center = getCenter(mother2);
            const zygoteCenter = getCenter(zygote);

            const moveItems = [
                { from: f1Center, chrom: fatherSelected1 },
                { from: f2Center, chrom: fatherSelected2 },
                { from: m1Center, chrom: motherSelected1 },
                { from: m2Center, chrom: motherSelected2 },
            ];
            for (let i = 0; i < 4; i++) {
                const useFather = random() < 0.5;
                if (useFather) {
                    const dishEl = random() < 0.5 ? father1 : father2;
                    moveItems.push({ from: getCenter(dishEl), chrom: { type: 'autosome', label: 'A' } });
                } else {
                    const dishEl = random() < 0.5 ? mother1 : mother2;
                    moveItems.push({ from: getCenter(dishEl), chrom: { type: 'autosome', label: 'A' } });
                }
            }

            const flyers = [];
            moveItems.forEach((item) => {
                const flyer = createFlyingChromosome(item.chrom.type, item.from.x - 11, item.from.y - 13);
                flyers.push({ el: flyer, target: zygoteCenter, chrom: item.chrom });
            });

            await new Promise(resolve => setTimeout(resolve, 50));

            flyers.forEach(flyer => {
                const el = flyer.el;
                el.style.left = (zygoteCenter.x - 11) + 'px';
                el.style.top = (zygoteCenter.y - 13) + 'px';
                el.style.opacity = '0.9';
            });

            await new Promise(resolve => setTimeout(resolve, 2300));

            flyers.forEach(flyer => {
                flyer.el.remove();
                if (zygoteChrom.length < 25) {
                    zygoteChrom.push(flyer.chrom);
                }
            });

            for (let i = 0; i < 6; i++) {
                if (zygoteChrom.length < 25) {
                    zygoteChrom.push({ type: 'autosome', label: 'A' });
                }
            }

            renderDish(zygote, zygoteChrom);

            father1.classList.remove('highlight');
            father2.classList.remove('highlight');
            mother1.classList.remove('highlight');
            mother2.classList.remove('highlight');

            animating = false;
            animateBtn.disabled = false;
        }

        // ========== 语音与打字同步 ==========
        function speakAndType() {
            if (window.hasSpoken) return;
            window.hasSpoken = true;

            const overlay = document.getElementById('speechOverlay');
            const speechText = document.getElementById('speechText');
            const fullText = '根据纸质版实验过程，模拟有性生殖。父本和母本各提供两个圆盘，染色体随机组合形成受精卵。';
            
            speechText.textContent = '';
            speechText.classList.remove('fade-out');
            overlay.classList.add('show');

            let charIndex = 0;
            const typeInterval = setInterval(() => {
                if (charIndex < fullText.length) {
                    speechText.textContent = fullText.slice(0, charIndex + 1);
                    charIndex++;
                } else {
                    clearInterval(typeInterval);
                    setTimeout(() => {
                        speechText.classList.add('fade-out');
                        setTimeout(() => {
                            overlay.classList.remove('show');
                            speechText.classList.remove('fade-out');
                        }, 2600);
                    }, 1500);
                }
            }, 60);

            if (window.speechSynthesis) {
                const utterance = new SpeechSynthesisUtterance(fullText);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.9;
                utterance.pitch = 1.0;
                utterance.volume = 1.0;
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(utterance);
            }
        }

        // ========== 下载功能 ==========
        function buildDataTable() {
            if (!chromosomeData || chromosomeData.length < 2) {
                chromosomeData = generateRandomChromosomeData();
            }
            return chromosomeData;
        }

        function downloadXlsx() {
            const data = buildDataTable();
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(data);
            XLSX.utils.book_append_sheet(wb, ws, '染色体数据');
            XLSX.writeFile(wb, '有性生殖_24对染色体.xlsx');
        }

        function downloadCsv() {
            const data = buildDataTable();
            const csvRows = data.map(row => row.map(cell => `"${cell}"`).join(','));
            const csvString = csvRows.join('\n');
            const blob = new Blob(['\uFEFF' + csvString], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '有性生殖_24对染色体.csv';
            link.click();
        }

        function downloadTxt() {
            const data = buildDataTable();
            const txtRows = data.map(row => row.join('\t'));
            const txtString = txtRows.join('\n');
            const blob = new Blob([txtString], { type: 'text/plain;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '有性生殖_24对染色体.txt';
            link.click();
        }

        // ========== 初始化 ==========
        window.addEventListener('load', () => {
            chromosomeData = generateRandomChromosomeData();
            const dishes = fillDishesRandom();
            fatherDish1Chrom = dishes.fatherDish1;
            fatherDish2Chrom = dishes.fatherDish2;
            motherDish1Chrom = dishes.motherDish1;
            motherDish2Chrom = dishes.motherDish2;
            zygoteChrom = [];
            renderAll();

            document.getElementById('animateBtn').addEventListener('click', performRealisticAnimation);
            document.getElementById('downloadXlsxBtn').addEventListener('click', downloadXlsx);
            document.getElementById('downloadCsvBtn').addEventListener('click', downloadCsv);
            document.getElementById('downloadTxtBtn').addEventListener('click', downloadTxt);

            setTimeout(() => {
                speakAndType();
            }, 300);

            document.addEventListener('click', function once() {
                if (!window.hasSpoken) {
                    speakAndType();
                }
                document.removeEventListener('click', once);
            }, { once: true });
        });

    })();
</script>
