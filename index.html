<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模拟有性生殖 · 基因随机匹配</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #f5f9ff 0%, #e6f0fa 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 10px;
            overflow-x: auto;
        }
        .experiment-container {
            width: 98vw;
            max-width: 1700px;
            min-width: 1100px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(8px);
            border-radius: 36px;
            box-shadow: 0 25px 40px -12px rgba(0, 20, 40, 0.35), inset 0 1px 4px rgba(255, 255, 255, 0.8);
            padding: 20px 30px 24px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            position: relative;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 500;
            color: #1e3b5c;
            margin: 0 0 6px 0;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        h1 span {
            background: #2b5a8c;
            color: white;
            font-size: 0.9rem;
            padding: 4px 16px;
            border-radius: 40px;
            font-weight: 400;
            letter-spacing: 2px;
        }
        .subhead {
            color: #3f5e7c;
            margin: 0 0 14px 0;
            font-size: 0.95rem;
            border-left: 4px solid #7aa5c7;
            padding-left: 14px;
            font-style: italic;
        }

        /* 横向布局：父本区 - 母本区 - 受精卵 */
        .dishes {
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: flex-start;
            gap: 20px;
            margin: 10px 0 18px;
            padding: 0 6px;
        }
        .parent-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            flex: 1;
        }
        .parent-title {
            font-weight: 600;
            font-size: 1.05rem;
            color: #1f4970;
            background: rgba(255, 255, 255, 0.7);
            padding: 6px 26px;
            border-radius: 100px;
            border: 1px solid #bfd9f0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }
        .parent-row {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 18px;
        }
        .dish-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .dish-caption {
            font-size: 0.82rem;
            color: #4a6a8a;
            font-weight: 500;
            white-space: nowrap;
        }

        /* 圆盘基础样式 */
        .dish {
            border-radius: 50%;
            background: #dfeaf5;
            box-shadow: 0 10px 16px -6px rgba(30, 60, 90, 0.25), inset 0 0 0 2px rgba(255,255,255,0.8), inset 0 0 18px rgba(80, 120, 160, 0.2);
            display: grid;
            justify-items: center;
            align-items: center;
            transition: box-shadow 0.3s;
            position: relative;
            border: 1px solid #ffffff;
            overflow: hidden;
            flex-shrink: 0;
        }
        /* 父/母体细胞大圆盘 */
        .dish.body {
            width: 170px;
            height: 170px;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 36px;
            gap: 2px;
            padding: 16px 12px;
        }
        .dish.father-body {
            background: #c8dff5;
        }
        .dish.mother-body {
            background: #f5d7e6;
        }
        /* 生殖细胞小圆盘 */
        .dish.gamete {
            width: 100px;
            height: 100px;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 30px;
            gap: 2px;
            padding: 10px 8px;
        }
        .dish.sperm {
            background: #b8d4ef;
            box-shadow: 0 8px 14px -6px rgba(30, 60, 90, 0.3), inset 0 0 0 2px rgba(255,255,255,0.8), inset 0 0 14px rgba(80, 120, 160, 0.25);
        }
        .dish.egg {
            background: #efc8d8;
            box-shadow: 0 8px 14px -6px rgba(90, 40, 70, 0.3), inset 0 0 0 2px rgba(255,255,255,0.8), inset 0 0 14px rgba(160, 80, 120, 0.25);
        }
        /* 受精卵 */
        .dish.zygote {
            width: 200px;
            height: 200px;
            background: #ffe8b6;
            box-shadow: 0 14px 24px -8px #b38b5b60, inset 0 0 0 3px #ffeac2, inset 0 0 24px #dbb47a40;
            border: 1px solid #f5e3b0;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 38px;
            gap: 3px;
            padding: 18px 14px;
        }

        /* 箭头 */
        .arrow {
            font-size: 1.6rem;
            color: #7aa5c7;
            padding: 0 4px;
            display: flex;
            align-items: center;
            user-select: none;
        }

        /* ============================================================
           染色体：用小棒 + 字母标注表示基因
           每条染色体是一根竖线，旁边标注一个字母
           ============================================================ */
        .chromosome {
            width: 34px;
            height: 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
            transition: all 0.2s;
            will-change: transform, opacity;
            line-height: 0;
        }
        /* 染色体棒（竖向） */
        .chromosome .rod {
            width: 6px;
            height: 26px;
            border-radius: 3px;
            background: linear-gradient(
                to right,
                rgba(90, 130, 170, 0.85) 0%,
                rgba(130, 170, 210, 1) 30%,
                rgba(170, 205, 235, 1) 50%,
                rgba(130, 170, 210, 1) 70%,
                rgba(90, 130, 170, 0.85) 100%
            );
            box-shadow: 0 1px 3px rgba(40, 80, 120, 0.35);
            border: 0.5px solid rgba(255,255,255,0.7);
        }
        /* 字母标签（放在棒旁边） */
        .chromosome .label {
            position: absolute;
            top: 0;
            right: -2px;
            font-size: 0.72rem;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            color: #1e3b5c;
            background: rgba(255,255,255,0.9);
            border-radius: 3px;
            padding: 0 2px;
            line-height: 1.2;
            box-shadow: 0 0 2px rgba(0,0,0,0.1);
        }
        /* 等位基因大写：深蓝 */
        .chromosome .label.dominant {
            color: #1c4a7a;
        }
        /* 等位基因小写：橙红 */
        .chromosome .label.recessive {
            color: #b3452a;
        }
        /* 不同基因对用不同色调的棒区分 */
        .chromosome[data-gene="A"] .rod {
            background: linear-gradient(to right, #6b8fc0, #9fc0e8, #6b8fc0);
        }
        .chromosome[data-gene="B"] .rod {
            background: linear-gradient(to right, #6bb08a, #9fd8b8, #6bb08a);
        }
        .chromosome[data-gene="D"] .rod {
            background: linear-gradient(to right, #c08a6b, #e8c09f, #c08a6b);
        }
        .chromosome[data-gene="E"] .rod {
            background: linear-gradient(to right, #9a6bc0, #c89fe8, #9a6bc0);
        }
        .chromosome[data-gene="F"] .rod {
            background: linear-gradient(to right, #c06b8a, #e89fbd, #c06b8a);
        }

        .chromosome:hover .rod {
            filter: brightness(1.15);
        }

        .highlight {
            box-shadow: 0 0 0 4px #f9e56c, 0 12px 24px -6px #7a6a2e50 !important;
        }

        /* ===== 按钮 ===== */
        .btn-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 2px dashed #b9d2e7;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .btn {
            background: #ffffffea;
            border: 1px solid #aac4dd;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #1a3e60;
            cursor: pointer;
            box-shadow: 0 6px 12px -6px #2f527330, 0 1px 3px #ffffff80 inset;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .btn:hover {
            background: #ffffff;
            border-color: #6d9ac2;
            box-shadow: 0 10px 18px -8px #1e3f5e50;
            transform: translateY(-1px);
        }
        .btn:active {
            transform: translateY(1px);
            box-shadow: 0 3px 6px -4px #2f5273;
        }
        .btn.primary {
            background: #2b5a8c;
            color: white;
            border-color: #1d3f60;
            box-shadow: 0 10px 16px -8px #1a3650;
        }
        .btn.primary:hover {
            background: #1f4a78;
        }
        .btn.secondary {
            background: #f1f7fe;
        }
        .btn:disabled {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(0.4);
        }
        .data-hint {
            font-size: 0.9rem;
            color: #3b5e7e;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        /* 语音浮现 */
        .speech-overlay {
            position: fixed;
            bottom: 8%;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            pointer-events: none;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .speech-overlay.show {
            opacity: 1;
        }
        .speech-text {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            padding: 16px 34px;
            border-radius: 80px;
            font-family: 'Microsoft YaHei', sans-serif;
            font-size: 1.4rem;
            font-weight: 500;
            color: #1e3b5c;
            letter-spacing: 2px;
            box-shadow: 0 20px 35px -8px #1f3b5840, 0 0 0 1px #ffffffd0 inset;
            border: 1px solid #d1e3f5;
            text-align: center;
            line-height: 1.5;
            white-space: nowrap;
            overflow: hidden;
            max-width: 90vw;
            text-overflow: ellipsis;
        }
        .speech-text.fade-out {
            animation: fadeOutWhite 2.5s forwards;
        }
        @keyframes fadeOutWhite {
            0% { opacity: 1; transform: scale(1); background: #ffffff; color: #1e3b5c; }
            70% { opacity: 1; transform: scale(1.02); background: #ffffff; color: #1e3b5c; }
            100% { opacity: 0; transform: scale(1.08); background: #ffffff; color: #ffffff; }
        }
        .small-note {
            font-size: 0.8rem;
            color: #6d8aa8;
            margin-top: 6px;
            text-align: right;
        }

        /* 飞行的染色体 */
        .flying-chromosome {
            position: fixed;
            z-index: 1000;
            pointer-events: none;
            transition: all 2.2s cubic-bezier(0.35, 0.05, 0.25, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 1150px) {
            body {
                justify-content: flex-start;
            }
            .experiment-container {
                min-width: 1100px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>

<div class="experiment-container" id="app">
    <h1>🧬 模拟有性生殖 <span>基因随机匹配</span></h1>
    <div class="subhead">父本与母本各产生生殖细胞，精子和卵细胞结合形成受精卵，基因随机组合</div>

    <!-- 横向布局：父本区 - 母本区 - 受精卵 -->
    <div class="dishes" id="dishesContainer">
        <!-- 父本区 -->
        <div class="parent-group">
            <div class="parent-title">👨 父本</div>
            <div class="parent-row">
                <div class="dish-wrapper">
                    <div class="dish body father-body" id="fatherBody"></div>
                    <div class="dish-caption">体细胞（成对基因）</div>
                </div>
                <div class="arrow">→</div>
                <div class="dish-wrapper">
                    <div class="dish gamete sperm" id="spermDish"></div>
                    <div class="dish-caption">精子（单个基因）</div>
                </div>
            </div>
        </div>

        <!-- 母本区 -->
        <div class="parent-group">
            <div class="parent-title">👩 母本</div>
            <div class="parent-row">
                <div class="dish-wrapper">
                    <div class="dish body mother-body" id="motherBody"></div>
                    <div class="dish-caption">体细胞（成对基因）</div>
                </div>
                <div class="arrow">→</div>
                <div class="dish-wrapper">
                    <div class="dish gamete egg" id="eggDish"></div>
                    <div class="dish-caption">卵细胞（单个基因）</div>
                </div>
            </div>
        </div>

        <!-- 受精卵 -->
        <div class="parent-group">
            <div class="parent-title">🧬 受精卵</div>
            <div class="dish-wrapper">
                <div class="dish zygote" id="zygoteDish"></div>
                <div class="dish-caption">基因随机组合</div>
            </div>
        </div>
    </div>

    <div class="btn-bar">
        <div class="btn-group">
            <button class="btn primary" id="animateBtn">▶ 开始受精动画</button>
            <button class="btn secondary" id="downloadXlsxBtn">⬇ 下载数据 (XLSX)</button>
            <button class="btn secondary" id="downloadCsvBtn">⬇ 下载 CSV</button>
            <button class="btn secondary" id="downloadTxtBtn">⬇ 下载 TXT</button>
        </div>
        <div class="data-hint">
            <span>🧬 基因随机匹配 · 数据实时生成</span>
        </div>
    </div>
    <div class="small-note">* 精子与卵细胞中的基因随机组合，形成受精卵的成对基因。</div>
</div>

<div class="speech-overlay" id="speechOverlay">
    <div class="speech-text" id="speechText"></div>
</div>

<script>
    (function() {
        // ========== 伪随机算法 ==========
        let seed = Date.now() + Math.random() * 1000000;
        function random() {
            seed = (seed * 9301 + 49297) % 233280;
            return seed / 233280;
        }
        function reseed() {
            seed = Date.now() + Math.random() * 1000000 + performance.now();
        }

        // 基因对定义：每对基因有显性（大写）和隐性（小写）
        const GENE_PAIRS = ['A', 'B', 'D', 'E', 'F'];

        // 生成一组基因数据
        // 父本体细胞：每对基因两个等位基因（随机大小写）
        // 母本体细胞：每对基因两个等位基因（随机大小写）
        // 精子：从父本体细胞每对中随机取一个
        // 卵细胞：从母本体细胞每对中随机取一个
        // 受精卵：精子基因 + 卵细胞基因（成对）
        let fatherBodyData = [];   // [{gene:'A', alleles:['A','a']}, ...]
        let motherBodyData = [];
        let spermData = [];        // [{gene:'A', allele:'A'}, ...]
        let eggData = [];
        let zygoteData = [];       // [{gene:'A', alleles:['A','a']}, ...]
        let chromosomeData = [];

        function generateAllData() {
            reseed();
            fatherBodyData = [];
            motherBodyData = [];
            spermData = [];
            eggData = [];
            zygoteData = [];
            chromosomeData = [];

            GENE_PAIRS.forEach(gene => {
                // 父本体细胞：两个等位基因随机显隐性
                const fAllele1 = random() < 0.5 ? gene.toUpperCase() : gene.toLowerCase();
                const fAllele2 = random() < 0.5 ? gene.toUpperCase() : gene.toLowerCase();
                fatherBodyData.push({ gene: gene, alleles: [fAllele1, fAllele2] });

                // 母本体细胞
                const mAllele1 = random() < 0.5 ? gene.toUpperCase() : gene.toLowerCase();
                const mAllele2 = random() < 0.5 ? gene.toUpperCase() : gene.toLowerCase();
                motherBodyData.push({ gene: gene, alleles: [mAllele1, mAllele2] });

                // 精子：从父本两个等位基因中随机取一个
                const spermAllele = random() < 0.5 ? fAllele1 : fAllele2;
                spermData.push({ gene: gene, allele: spermAllele });

                // 卵细胞：从母本两个等位基因中随机取一个
                const eggAllele = random() < 0.5 ? mAllele1 : mAllele2;
                eggData.push({ gene: gene, allele: eggAllele });

                // 受精卵：精子 + 卵细胞
                zygoteData.push({ gene: gene, alleles: [spermAllele, eggAllele] });
            });

            // 构建下载表格数据
            chromosomeData = [];
            chromosomeData.push(['基因对', '父本体细胞等位基因1', '父本体细胞等位基因2', '母本体细胞等位基因1', '母本体细胞等位基因2', '精子基因', '卵细胞基因', '受精卵等位基因1', '受精卵等位基因2']);
            GENE_PAIRS.forEach((gene, i) => {
                chromosomeData.push([
                    gene,
                    fatherBodyData[i].alleles[0], fatherBodyData[i].alleles[1],
                    motherBodyData[i].alleles[0], motherBodyData[i].alleles[1],
                    spermData[i].allele,
                    eggData[i].allele,
                    zygoteData[i].alleles[0], zygoteData[i].alleles[1]
                ]);
            });
        }

        // ========== 创建染色体元素（棒 + 字母） ==========
        function createChromosomeElement(gene, allele) {
            const wrapper = document.createElement('div');
            wrapper.className = 'chromosome';
            wrapper.setAttribute('data-gene', gene);

            const rod = document.createElement('div');
            rod.className = 'rod';

            const label = document.createElement('div');
            label.className = 'label ' + (allele === allele.toUpperCase() ? 'dominant' : 'recessive');
            label.textContent = allele;

            wrapper.appendChild(rod);
            wrapper.appendChild(label);
            return wrapper;
        }

        // 渲染体细胞大圆盘（显示成对基因）
        function renderBodyDish(element, data) {
            if (!element) return;
            element.innerHTML = '';
            data.forEach(item => {
                // 每对基因显示两个染色体，并排
                const pairWrapper = document.createElement('div');
                pairWrapper.style.display = 'flex';
                pairWrapper.style.gap = '2px';
                pairWrapper.style.alignItems = 'center';
                pairWrapper.style.justifyContent = 'center';
                item.alleles.forEach(allele => {
                    pairWrapper.appendChild(createChromosomeElement(item.gene, allele));
                });
                element.appendChild(pairWrapper);
            });
        }

        // 渲染生殖细胞小圆盘（显示单个基因）
        function renderGameteDish(element, data) {
            if (!element) return;
            element.innerHTML = '';
            data.forEach(item => {
                element.appendChild(createChromosomeElement(item.gene, item.allele));
            });
        }

        // 渲染受精卵（成对基因）
        function renderZygoteDish(element, data) {
            if (!element) return;
            element.innerHTML = '';
            data.forEach(item => {
                const pairWrapper = document.createElement('div');
                pairWrapper.style.display = 'flex';
                pairWrapper.style.gap = '2px';
                pairWrapper.style.alignItems = 'center';
                pairWrapper.style.justifyContent = 'center';
                item.alleles.forEach(allele => {
                    pairWrapper.appendChild(createChromosomeElement(item.gene, allele));
                });
                element.appendChild(pairWrapper);
            });
        }

        function renderAll() {
            renderBodyDish(document.getElementById('fatherBody'), fatherBodyData);
            renderBodyDish(document.getElementById('motherBody'), motherBodyData);
            renderGameteDish(document.getElementById('spermDish'), spermData);
            renderGameteDish(document.getElementById('eggDish'), eggData);
            renderZygoteDish(document.getElementById('zygoteDish'), zygoteData);
        }

        // ========== 动画核心 ==========
        let animating = false;

        function getCenter(el) {
            const rect = el.getBoundingClientRect();
            return { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
        }

        function createFlyingChromosome(gene, allele, startX, startY) {
            const div = document.createElement('div');
            div.className = 'flying-chromosome';
            div.style.left = startX + 'px';
            div.style.top = startY + 'px';
            div.style.position = 'fixed';

            const chrEl = createChromosomeElement(gene, allele);
            div.appendChild(chrEl);

            document.body.appendChild(div);
            return div;
        }

        async function performAnimation() {
            if (animating) return;
            animating = true;
            const animateBtn = document.getElementById('animateBtn');
            animateBtn.disabled = true;

            // 重新生成数据（每次动画都不同）
            generateAllData();

            // 清空受精卵
            zygoteData = [];
            renderZygoteDish(document.getElementById('zygoteDish'), zygoteData);

            // 重新渲染父本母本和生殖细胞
            renderBodyDish(document.getElementById('fatherBody'), fatherBodyData);
            renderBodyDish(document.getElementById('motherBody'), motherBodyData);
            renderGameteDish(document.getElementById('spermDish'), spermData);
            renderGameteDish(document.getElementById('eggDish'), eggData);

            const spermDish = document.getElementById('spermDish');
            const eggDish = document.getElementById('eggDish');
            const zygote = document.getElementById('zygoteDish');

            spermDish.classList.add('highlight');
            eggDish.classList.add('highlight');

            const spermCenter = getCenter(spermDish);
            const eggCenter = getCenter(eggDish);
            const zygoteCenter = getCenter(zygote);

            // 让精子和卵细胞的每个基因分别飞入受精卵
            const flyers = [];

            // 精子基因飞行
            spermData.forEach((item, idx) => {
                const startX = spermCenter.x - 17 + (idx % 3) * 20;
                const startY = spermCenter.y - 15 + Math.floor(idx / 3) * 18;
                const flyer = createFlyingChromosome(item.gene, item.allele, startX, startY);
                flyers.push({ el: flyer, target: zygoteCenter, gene: item.gene, allele: item.allele, from: 'sperm' });
            });

            // 卵细胞基因飞行
            eggData.forEach((item, idx) => {
                const startX = eggCenter.x - 17 + (idx % 3) * 20;
                const startY = eggCenter.y - 15 + Math.floor(idx / 3) * 18;
                const flyer = createFlyingChromosome(item.gene, item.allele, startX, startY);
                flyers.push({ el: flyer, target: zygoteCenter, gene: item.gene, allele: item.allele, from: 'egg' });
            });

            await new Promise(resolve => setTimeout(resolve, 60));

            // 让它们飞向受精卵中心
            flyers.forEach(flyer => {
                const el = flyer.el;
                el.style.left = (zygoteCenter.x - 17) + 'px';
                el.style.top = (zygoteCenter.y - 15) + 'px';
                el.style.opacity = '0.85';
            });

            await new Promise(resolve => setTimeout(resolve, 2300));

            // 移除飞行元素，重建受精卵数据
            flyers.forEach(flyer => flyer.el.remove());

            // 受精卵数据：精子 + 卵细胞 配对
            zygoteData = GENE_PAIRS.map((gene, i) => ({
                gene: gene,
                alleles: [spermData[i].allele, eggData[i].allele]
            }));

            renderZygoteDish(zygote, zygoteData);

            spermDish.classList.remove('highlight');
            eggDish.classList.remove('highlight');

            animating = false;
            animateBtn.disabled = false;
        }

        // ========== 语音与打字同步 ==========
        function speakAndType() {
            if (window.hasSpoken) return;
            window.hasSpoken = true;

            const overlay = document.getElementById('speechOverlay');
            const speechText = document.getElementById('speechText');
            const fullText = '模拟有性生殖中的基因随机匹配。父本和母本各提供生殖细胞，精子和卵细胞结合形成受精卵，基因随机组合。';

            speechText.textContent = '';
            speechText.classList.remove('fade-out');
            overlay.classList.add('show');

            let charIndex = 0;
            const typeInterval = setInterval(() => {
                if (charIndex < fullText.length) {
                    speechText.textContent = fullText.slice(0, charIndex + 1);
                    charIndex++;
                } else {
                    clearInterval(typeInterval);
                    setTimeout(() => {
                        speechText.classList.add('fade-out');
                        setTimeout(() => {
                            overlay.classList.remove('show');
                            speechText.classList.remove('fade-out');
                        }, 2600);
                    }, 1500);
                }
            }, 60);

            if (window.speechSynthesis) {
                const utterance = new SpeechSynthesisUtterance(fullText);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.9;
                utterance.pitch = 1.0;
                utterance.volume = 1.0;
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(utterance);
            }
        }

        // ========== 下载功能 ==========
        function downloadXlsx() {
            const data = chromosomeData.length > 1 ? chromosomeData : (generateAllData(), chromosomeData);
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(data);
            XLSX.utils.book_append_sheet(wb, ws, '基因数据');
            XLSX.writeFile(wb, '有性生殖_基因匹配数据.xlsx');
        }

        function downloadCsv() {
            if (chromosomeData.length < 2) generateAllData();
            const csvRows = chromosomeData.map(row => row.map(cell => `"${cell}"`).join(','));
            const csvString = csvRows.join('\n');
            const blob = new Blob(['\uFEFF' + csvString], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '有性生殖_基因匹配数据.csv';
            link.click();
        }

        function downloadTxt() {
            if (chromosomeData.length < 2) generateAllData();
            const txtRows = chromosomeData.map(row => row.join('\t'));
            const txtString = txtRows.join('\n');
            const blob = new Blob([txtString], { type: 'text/plain;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '有性生殖_基因匹配数据.txt';
            link.click();
        }

        // ========== 初始化 ==========
        window.addEventListener('load', () => {
            generateAllData();
            renderAll();

            document.getElementById('animateBtn').addEventListener('click', performAnimation);
            document.getElementById('downloadXlsxBtn').addEventListener('click', downloadXlsx);
            document.getElementById('downloadCsvBtn').addEventListener('click', downloadCsv);
            document.getElementById('downloadTxtBtn').addEventListener('click', downloadTxt);

            setTimeout(() => {
                speakAndType();
            }, 300);

            document.addEventListener('click', function once() {
                if (!window.hasSpoken) {
                    speakAndType();
                }
                document.removeEventListener('click', once);
            }, { once: true });
        });

    })();
</script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
