<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>基因决定外貌 · 发育模拟</title>
<style>
:root {
  --blue: #2563EB;
  --blue-dark: #1D4ED8;
  --blue-light: #93C5FD;
  --blue-bg: #EFF6FF;
  --text: #1E293B;
  --text-sub: #64748B;
  --border: #E2E8F0;
  --card: #FFFFFF;
}
* { margin:0; padding:0; box-sizing:border-box; user-select:none;
    font-family:-apple-system,'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; }
body { background:#0a0e1a; overflow:hidden; width:100vw; height:100vh; color:var(--text); }
#stage {
  position:fixed; top:0; left:0; width:100%; height:100%;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}
#cellCanvas {
  position:absolute; top:0; left:0; width:100%; height:100%;
  display:block; cursor:grab;
}
#cellCanvas:active { cursor:grabbing; }
#imgWrap {
  position:absolute;
  width:min(75vh, 65vw);
  height:min(75vh, 65vw);
  display:none;
  align-items:center; justify-content:center;
  transition:opacity .6s ease;
}
#imgWrap.show { display:flex; }
#humanImg {
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  transition:transform .6s cubic-bezier(.4,0,.2,1);
  transform-origin: center bottom;
}

/* ===== UI ===== */
.card { position:absolute; background:var(--card); border-radius:16px;
  box-shadow:0 2px 12px rgba(37,99,235,.08), 0 1px 3px rgba(0,0,0,.04);
  color:var(--text); z-index:10; transition:opacity .3s ease; }
.card * { pointer-events:auto; }
#topBar { top:18px; left:50%; transform:translateX(-50%);
  display:flex; gap:20px; align-items:center; padding:10px 22px;
  background:linear-gradient(135deg, var(--blue), var(--blue-dark));
  border-radius:28px; box-shadow:0 8px 24px rgba(37,99,235,.3);
  white-space:nowrap; flex-wrap:wrap; justify-content:center; color:#FFF; }
#topBar h1 { font-size:.92rem; font-weight:600; letter-spacing:.5px;
  color:#FFF; display:flex; align-items:center; gap:8px; }
#topBar h1::before { content:""; width:7px; height:7px; border-radius:50%;
  background:var(--blue-light); box-shadow:0 0 10px var(--blue-light); }
.stat { display:flex; align-items:center; gap:6px; font-size:.76rem; font-weight:500; }
.stat .k { color:rgba(255,255,255,.78); font-size:.7rem; }
.stat .v { font-family:'SF Mono',Consolas,monospace; font-weight:600; font-size:.76rem;
  padding:3px 10px; border-radius:12px; background:rgba(255,255,255,.18); color:#FFF; }
.stat .v.sex { color:#FDE68A; }
#genePanel { top:96px; left:20px; width:278px; max-height:calc(100vh - 230px);
  overflow-y:auto; padding:18px 20px; border:1px solid var(--border); }
#genePanel::-webkit-scrollbar { width:5px; }
#genePanel::-webkit-scrollbar-thumb { background:#CBD5E1; border-radius:3px; }
#genePanel h3 { font-size:.84rem; font-weight:600; color:var(--text);
  margin-bottom:14px; display:flex; align-items:center; gap:8px;
  padding-bottom:12px; border-bottom:2px solid var(--blue-light); }
#genePanel h3::before { content:"🧬"; font-size:1rem; }
.gene-group-title { font-size:.68rem; font-weight:600; color:var(--blue);
  letter-spacing:1.2px; text-transform:uppercase; margin:16px 0 8px 0;
  padding-left:9px; border-left:3px solid var(--blue); line-height:1; }
.gene-group-title:first-of-type { margin-top:0; }
.gene-row { display:flex; justify-content:space-between; align-items:center;
  font-size:.72rem; padding:7px 0; border-bottom:1px solid #F1F5F9; }
.gene-row:last-child { border-bottom:none; }
.gene-row .name { color:var(--text-sub); font-family:'SF Mono',Consolas,monospace; font-size:.68rem; }
.gene-row .gt { color:var(--text); font-weight:600; font-family:'SF Mono',Consolas,monospace;
  font-size:.7rem; padding:2px 7px; border-radius:6px; background:#F1F5F9; }
.gene-row .pt { color:var(--blue); font-weight:600; font-size:.72rem;
  min-width:68px; text-align:right; display:flex; align-items:center;
  justify-content:flex-end; gap:5px; }
.gene-row .swatch { width:11px; height:11px; border-radius:50%;
  display:inline-block; box-shadow:0 0 0 1px rgba(0,0,0,.08); flex-shrink:0; }
#timeline { position:absolute; bottom:18px; left:50%; transform:translateX(-50%);
  display:flex; flex-direction:column; gap:12px; padding:16px 20px;
  width:min(840px, 95vw); background:var(--card); border-radius:18px;
  box-shadow:0 8px 28px rgba(37,99,235,.12), 0 2px 6px rgba(0,0,0,.04);
  border:1px solid var(--border); z-index:20; }
.stage-track { display:flex; gap:6px; }
.stage-node { flex:1; padding:9px 4px; border-radius:11px; text-align:center;
  font-size:.67rem; cursor:pointer; background:#F1F5F9;
  border:1.5px solid transparent; color:var(--text-sub);
  transition:all .22s cubic-bezier(.4,0,.2,1); font-weight:500; line-height:1.2; }
.stage-node:hover { background:var(--blue-bg); color:var(--blue); transform:translateY(-1px); }
.stage-node.active { background:linear-gradient(135deg, var(--blue), var(--blue-dark));
  color:#FFF; border-color:var(--blue); box-shadow:0 4px 14px rgba(37,99,235,.35);
  font-weight:600; }
.stage-node.done { background:var(--blue-bg); color:var(--blue); border-color:var(--blue-light); }
.stage-node .num { font-size:.56rem; opacity:.7; display:block; margin-bottom:2px; font-weight:400; }
.play-bar { display:flex; align-items:center; gap:10px; }
.progress-wrap { flex:1; height:7px; border-radius:4px; background:#E2E8F0; overflow:hidden; }
.progress-fill { height:100%; width:0%; border-radius:4px;
  background:linear-gradient(90deg, var(--blue-light), var(--blue));
  transition:width .25s cubic-bezier(.4,0,.2,1);
  box-shadow:0 0 8px rgba(37,99,235,.4); }
.btn { padding:10px 20px; border:none; border-radius:22px; font-size:.77rem;
  font-weight:600; cursor:pointer; transition:all .18s cubic-bezier(.4,0,.2,1);
  color:var(--text); background:#F1F5F9; white-space:nowrap; font-family:inherit; outline:none; }
.btn:hover:not(:disabled) { background:#E2E8F0; transform:translateY(-1px);
  box-shadow:0 2px 6px rgba(0,0,0,.06); }
.btn:disabled { opacity:.38; cursor:not-allowed; }
.btn.primary { background:linear-gradient(135deg, var(--blue), var(--blue-dark));
  color:#FFF; box-shadow:0 4px 12px rgba(37,99,235,.3); }
.btn.primary:hover:not(:disabled) { box-shadow:0 6px 18px rgba(37,99,235,.45);
  background:linear-gradient(135deg, #1D4ED8, #1E40AF); }
.btn.reset { background:#FEF2F2; color:#DC2626; }
#stageTitle { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  font-size:2.6rem; font-weight:700; color:#FFFFFF;
  text-shadow:0 0 40px rgba(37,99,235,.9), 0 0 80px rgba(37,99,235,.5);
  letter-spacing:12px; opacity:0; transition:opacity .5s; pointer-events:none;
  z-index:30; white-space:nowrap; padding-left:12px; }
#stageTitle.show { opacity:1; animation:titleIn .7s cubic-bezier(.2,.8,.3,1); }
@keyframes titleIn { 0% { opacity:0; transform:translate(-50%,-50%) scale(1.35); }
  100% { opacity:1; transform:translate(-50%,-50%) scale(1); } }
#uiHint { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(6px);
  padding:11px 22px; background:rgba(30,41,59,.92); backdrop-filter:blur(12px);
  border-radius:24px; color:#FFF; font-size:.79rem; box-shadow:0 8px 28px rgba(0,0,0,.28);
  z-index:50; opacity:0; pointer-events:none; transition:opacity .35s, transform .35s; }
#uiHint.show { opacity:1; transform:translateX(-50%) translateY(0); }
#f5Badge { position:fixed; top:18px; right:18px; z-index:50; padding:7px 13px;
  background:rgba(30,41,59,.85); backdrop-filter:blur(8px); border-radius:18px;
  color:var(--blue-light); font-size:.68rem; font-family:'SF Mono',Consolas,monospace;
  transition:opacity .35s; pointer-events:none; }
#loadInfo { position:fixed; top:64px; left:50%; transform:translateX(-50%);
  background:rgba(30,41,59,.85); backdrop-filter:blur(8px); color:var(--blue-light);
  font:12px 'SF Mono',Consolas,monospace; padding:8px 16px; border-radius:8px;
  z-index:100; max-width:90vw; white-space:pre; text-align:center;
  pointer-events:none; transition:opacity .4s; line-height:1.5; }
.ui-hidden { opacity: 0 !important; pointer-events: none !important; }
@media (max-width:1200px) {
  #genePanel { width:240px; }
  #topBar { gap:14px; padding:9px 18px; } #topBar h1 { font-size:.84rem; }
}
@media (max-width:720px) {
  #genePanel { display:none; } #topBar h1 { font-size:.76rem; }
  .stat { font-size:.68rem; } .stage-node { font-size:.56rem; padding:7px 2px; }
  .btn { padding:8px 14px; font-size:.7rem; }
}
</style>
</head>
<body>

<div id="stage">
  <canvas id="cellCanvas"></canvas>
  <div id="imgWrap">
    <img id="humanImg" src="胎儿1.png" alt="胎儿" crossorigin="anonymous">
  </div>
</div>

<div id="f5Badge">按 F5 切换 UI</div>
<div id="loadInfo">初始化…</div>

<div id="topBar" class="card">
  <h1>基因决定外貌 · 发育模拟</h1>
  <div class="stat"><span class="k">性别</span><span class="v sex" id="statSex">—</span></div>
  <div class="stat"><span class="k">身高</span><span class="v" id="statHeight">—</span></div>
  <div class="stat"><span class="k">阶段</span><span class="v" id="statStage">受精卵</span></div>
</div>

<div id="genePanel" class="card">
  <h3>基因型 → 外貌表现</h3>
  <div id="geneList"></div>
</div>

<div id="timeline">
  <div class="stage-track">
    <div class="stage-node active" data-stage="0"><span class="num">01</span>受精卵</div>
    <div class="stage-node" data-stage="1"><span class="num">02</span>卵裂</div>
    <div class="stage-node" data-stage="2"><span class="num">03</span>桑葚胚</div>
    <div class="stage-node" data-stage="3"><span class="num">04</span>囊胚</div>
    <div class="stage-node" data-stage="4"><span class="num">05</span>原肠胚</div>
    <div class="stage-node" data-stage="5"><span class="num">06</span>器官发生</div>
    <div class="stage-node" data-stage="6"><span class="num">07</span>胎儿</div>
    <div class="stage-node" data-stage="7"><span class="num">08</span>完整个体</div>
  </div>
  <div class="play-bar">
    <button class="btn primary" id="btnPlay">▶ 播放发育</button>
    <button class="btn" id="btnStep">⏭ 单步</button>
    <button class="btn reset" id="btnReset">🔄 重新随机基因</button>
    <div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div>
    <span style="font-size:.7rem;color:var(--blue);font-family:'SF Mono',Consolas,monospace;min-width:42px;text-align:right;font-weight:600;" id="progressText">0%</span>
  </div>
</div>

<div id="stageTitle"></div>
<div id="uiHint">UI 已隐藏 · 再按 F5 显示</div>

<script>
(function(){
'use strict';

/* ============================================================
   1. 基因引擎
   ============================================================ */
const GeneEngine = {
  loci: [
    { key:'SEX', name:'性别', type:'sex' },
    { key:'SKIN1', name:'肤色-1', dom:'S', rec:'s' },
    { key:'SKIN2', name:'肤色-2', dom:'T', rec:'t' },
    { key:'SKIN3', name:'肤色-3', dom:'U', rec:'u' },
    { key:'HAIR_B', name:'发色-棕黑', dom:'B', rec:'b' },
    { key:'HAIR_R', name:'发色-红', dom:'R', rec:'r' },
    { key:'EYE_B', name:'瞳色-棕', dom:'E', rec:'e' },
    { key:'EYE_G', name:'瞳色-绿', dom:'G', rec:'g' },
    { key:'HT1', name:'身高-1', dom:'H', rec:'h' },
    { key:'HT2', name:'身高-2', dom:'I', rec:'i' },
    { key:'HT3', name:'身高-3', dom:'J', rec:'j' },
    { key:'BODY', name:'体型', dom:'F', rec:'f' },
    { key:'MUSC', name:'肌肉', dom:'M', rec:'m' },
    { key:'FACE', name:'脸型', dom:'L', rec:'l' },
    { key:'NOSE', name:'鼻型', dom:'N', rec:'n' },
    { key:'EYELID', name:'眼睑', dom:'D', rec:'d' },
    { key:'EYESIZE', name:'眼大小', dom:'P', rec:'p' },
    { key:'EYEGAP', name:'眼距', dom:'Q', rec:'q' },
    { key:'LIP', name:'嘴唇', dom:'K', rec:'k' },
    { key:'BROW', name:'眉毛', dom:'W', rec:'w' },
    { key:'SHOULDER', name:'肩宽', dom:'V', rec:'v' },
    { key:'LEG', name:'腿长', dom:'Z', rec:'z' },
    { key:'EAR', name:'耳型', dom:'Y', rec:'y' },
    { key:'FRECKLE', name:'雀斑', dom:'X', rec:'x' }
  ],
  randomIndividual(p){
    const gt = {};
    gt.SEX = Math.random() < 0.5 ? ['X','X'] : ['X','Y'];
    for(let i=1;i<this.loci.length;i++){
      const l = this.loci[i];
      gt[l.key] = [Math.random()<p?l.dom:l.rec, Math.random()<p?l.dom:l.rec];
    }
    return gt;
  },
  randomGamete(gt){
    const g = {};
    for(const k in gt) g[k] = gt[k][Math.random()<0.5?0:1];
    return g;
  },
  fertilize(sperm, egg){
    const z = {};
    z.SEX = [egg.SEX, sperm.SEX];
    for(const k in sperm){
      if(k === 'SEX') continue;
      const order = Math.random()<0.5;
      z[k] = order ? [sperm[k], egg[k]] : [egg[k], sperm[k]];
    }
    return z;
  },
  getPhenotype(gt){
    const p = {};
    p.sex = gt.SEX.includes('Y') ? 'male' : 'female';
    p.sexLabel = p.sex === 'male' ? '男 XY' : '女 XX';

    let skinScore = 0;
    for(const k of ['SKIN1','SKIN2','SKIN3']){
      const l = this.loci.find(x => x.key === k);
      for(const a of gt[k]) if(a === l.dom) skinScore++;
    }
    p.skinScore = skinScore;
    // 7 档肤色，从极浅到极深
    const tones = [
      [0.98,0.86,0.78],[0.96,0.82,0.72],[0.92,0.76,0.64],
      [0.85,0.68,0.55],[0.72,0.54,0.42],[0.56,0.38,0.28],[0.38,0.24,0.16]
    ];
    p.skinColor = tones[Math.min(6, skinScore)];
    p.skinLabel = ['极浅','很浅','浅','中','深','很深','极深'][skinScore];

    const bHair = gt.HAIR_B.includes('B');
    const rHair = gt.HAIR_R.includes('R');
    if(rHair && !bHair){ p.hairColor=[0.72,0.28,0.14]; p.hairLabel='红发'; }
    else if(bHair){
      const c = gt.HAIR_B.filter(a=>a==='B').length;
      if(c===2){ p.hairColor=[0.06,0.04,0.04]; p.hairLabel='乌黑'; }
      else { p.hairColor=[0.26,0.15,0.08]; p.hairLabel='深棕'; }
    } else { p.hairColor=[0.72,0.58,0.34]; p.hairLabel='金发'; }

    const bEye = gt.EYE_B.includes('E');
    const gEye = gt.EYE_G.includes('G');
    if(bEye){ p.eyeColor=[0.32,0.18,0.08]; p.eyeLabel='棕色'; }
    else if(gEye){ p.eyeColor=[0.28,0.48,0.34]; p.eyeLabel='绿色'; }
    else { p.eyeColor=[0.42,0.55,0.72]; p.eyeLabel='蓝色'; }

    let hs = 0;
    for(const k of ['HT1','HT2','HT3']){
      const l = this.loci.find(x => x.key === k);
      for(const a of gt[k]) if(a === l.dom) hs++;
    }
    p.heightScore = hs;
    p.heightM = 1.55 + hs*0.045 + (p.sex === 'male' ? 0.13 : 0);
    p.heightCm = Math.round(p.heightM*100);
    p.heightLabel = p.heightCm + ' cm';

    p.bodyType = gt.BODY.filter(a=>a==='F').length;
    p.bodyLabel = ['瘦','中','壮'][p.bodyType];
    p.muscleCount = gt.MUSC.filter(a=>a==='M').length;
    p.muscleLabel = ['少','中','多'][p.muscleCount];
    p.faceCount = gt.FACE.filter(a=>a==='L').length;
    p.faceLabel = p.faceCount >= 1 ? '圆/宽' : '长/窄';
    p.faceWidth = 0.94 + p.faceCount*0.06;
    p.noseCount = gt.NOSE.filter(a=>a==='N').length;
    p.noseLabel = p.noseCount >= 1 ? '挺' : '塌';
    p.doubleLid = gt.EYELID.includes('D');
    p.lidLabel = p.doubleLid ? '双眼皮' : '单眼皮';
    p.eyeSizeCount = gt.EYESIZE.filter(a=>a==='P').length;
    p.eyeSizeLabel = ['小','中','大'][p.eyeSizeCount];
    p.eyeSize = 0.12 + p.eyeSizeCount*0.015;
    p.eyeGapCount = gt.EYEGAP.filter(a=>a==='Q').length;
    p.eyeGapLabel = ['近','中','宽'][p.eyeGapCount];
    p.eyeGap = 0.36 + p.eyeGapCount*0.035;
    p.lipCount = gt.LIP.filter(a=>a==='K').length;
    p.lipLabel = ['薄','中','厚'][p.lipCount];
    p.lipThickness = 0.05 + p.lipCount*0.02;
    p.browCount = gt.BROW.filter(a=>a==='W').length;
    p.browLabel = ['淡','中','浓'][p.browCount];
    p.browThickness = 0.03 + p.browCount*0.012;
    p.shoulderCount = gt.SHOULDER.filter(a=>a==='V').length;
    p.shoulderLabel = ['窄','中','宽'][p.shoulderCount];
    p.shoulderWidth = 1.20 + p.shoulderCount*0.08;
    p.legCount = gt.LEG.filter(a=>a==='Z').length;
    p.legLabel = ['短','中','长'][p.legCount];
    p.legLength = 0.97 + p.legCount*0.025;
    p.earCount = gt.EAR.filter(a=>a==='Y').length;
    p.earLabel = p.earCount >= 1 ? '招风耳' : '贴脑耳';
    p.hasFreckle = gt.FRECKLE.includes('X');
    p.freckleLabel = p.hasFreckle ? '有' : '无';
    return p;
  }
};

/* ============================================================
   2. 状态
   ============================================================ */
const MAX_CELLS = 60;
const STATE = {
  fatherGT: null, motherGT: null, zygoteGT: null, phenotype: null,
  cells: [], stage: 0, divisions: 0, playing: false, playTimer: 0, speed: 1.0,
  animT: 0, lastFrameTime: 0
};
const STAGES = [
  { name:'受精卵', div:0 },
  { name:'卵裂', div:4 },
  { name:'桑葚胚', div:8 },
  { name:'囊胚', div:16 },
  { name:'原肠胚', div:28 },
  { name:'器官发生', div:44 },
  { name:'胎儿', div:54 },
  { name:'完整个体', div:MAX_CELLS }
];

/* ============================================================
   3. Canvas 细胞团绘制
   ============================================================ */
const cellCanvas = document.getElementById('cellCanvas');
const ctx = cellCanvas.getContext('2d');

function resizeCanvas(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cellCanvas.width = Math.floor(window.innerWidth * dpr);
  cellCanvas.height = Math.floor(window.innerHeight * dpr);
  cellCanvas.style.width = window.innerWidth + 'px';
  cellCanvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const cam = { yaw: 0.3, pitch: 0.2, dragging: false, lastX: 0, lastY: 0, autoRotate: true };
cellCanvas.addEventListener('mousedown', e => { cam.dragging = true; cam.lastX = e.clientX; cam.lastY = e.clientY; });
window.addEventListener('mousemove', e => {
  if(cam.dragging){
    cam.yaw -= (e.clientX - cam.lastX) * 0.01;
    cam.pitch += (e.clientY - cam.lastY) * 0.01;
    cam.pitch = Math.max(-1, Math.min(1, cam.pitch));
    cam.lastX = e.clientX; cam.lastY = e.clientY;
  }
});
window.addEventListener('mouseup', () => cam.dragging = false);

function project(x, y, z){
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  let x1 = x * cy + z * sy;
  let z1 = -x * sy + z * cy;
  let y1 = y * cp - z1 * sp;
  let z2 = y * sp + z1 * cp;
  const focal = 800;
  const scale = focal / (focal + z2 * 200);
  return {
    x: window.innerWidth / 2 + x1 * scale,
    y: window.innerHeight / 2 + y1 * scale,
    scale: scale
  };
}

function drawCellCluster(){
  const w = window.innerWidth, h = window.innerHeight;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#0a0e1a';
  ctx.fillRect(0, 0, w, h);

  const p = STATE.phenotype;
  const cells = STATE.cells;
  const sorted = cells.map((c, i) => {
    const pr = project(c.pos[0], -c.pos[1], c.pos[2]);
    return { cell: c, pr };
  }).sort((a, b) => a.pr.scale - b.pr.scale);

  for(const { cell, pr } of sorted){
    let color;
    if(cell.type === 'stem') color = [0.55, 0.85, 0.5];
    else if(cell.type === 'ectoderm') color = [0.4, 0.7, 1.0];
    else if(cell.type === 'mesoderm') color = [1.0, 0.5, 0.4];
    else if(cell.type === 'endoderm') color = [0.5, 1.0, 0.6];
    else if(cell.type === 'neuron') color = [0.9, 0.6, 0.85];
    else if(cell.type === 'heart') color = [0.9, 0.2, 0.3];
    else if(cell.type === 'lung') color = [0.86, 0.42, 0.58];
    else if(cell.type === 'liver') color = [0.42, 0.12, 0.18];
    else if(cell.type === 'stomach') color = [0.82, 0.48, 0.28];
    else if(cell.type === 'intestine') color = [0.78, 0.72, 0.45];
    else if(cell.type === 'kidney') color = [0.55, 0.28, 0.42];
    else if(cell.type === 'muscle') color = [0.75, 0.25, 0.3];
    else color = p.skinColor;

    const r = cell.size * 40 * pr.scale;
    const grd = ctx.createRadialGradient(pr.x - r*0.3, pr.y - r*0.3, r*0.1, pr.x, pr.y, r);
    const rgb = `rgb(${Math.round(color[0]*255)},${Math.round(color[1]*255)},${Math.round(color[2]*255)})`;
    const darker = `rgb(${Math.round(color[0]*180)},${Math.round(color[1]*180)},${Math.round(color[2]*180)})`;
    grd.addColorStop(0, `rgba(${Math.min(255, Math.round(color[0]*255+60))},${Math.min(255, Math.round(color[1]*255+60))},${Math.min(255, Math.round(color[2]*255+60))},1)`);
    grd.addColorStop(0.7, rgb);
    grd.addColorStop(1, darker);
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(pr.x, pr.y, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.beginPath();
    ctx.arc(pr.x - r*0.3, pr.y - r*0.3, r*0.25, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* ============================================================
   4. 图片逐像素换肤
   ============================================================ */
const imgWrap = document.getElementById('imgWrap');
const humanImg = document.getElementById('humanImg');
const loadInfo = document.getElementById('loadInfo');
let originalImageData = null;
let imageLoaded = false;
const skinCache = new Map();

humanImg.onload = () => {
  const c = document.createElement('canvas');
  c.width = humanImg.naturalWidth;
  c.height = humanImg.naturalHeight;
  const cx2 = c.getContext('2d');
  cx2.drawImage(humanImg, 0, 0);
  originalImageData = cx2.getImageData(0, 0, c.width, c.height);
  imageLoaded = true;
  loadInfo.textContent = '✅ 图片已加载 (' + c.width + '×' + c.height + ')';
  setTimeout(()=> { loadInfo.style.opacity = '0'; }, 2500);
  applyPhenotypeToImage();
};
humanImg.onerror = () => {
  loadInfo.textContent = '❌ 图片加载失败，检查胎儿1.png';
};

function rgb2hsv(r, g, b){
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const d = max - min;
  let h = 0;
  if(d !== 0){
    if(max === r) h = ((g - b) / d) % 6;
    else if(max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
    if(h < 0) h += 360;
  }
  const s = max === 0 ? 0 : d / max;
  const v = max;
  return [h, s, v];
}
function hsv2rgb(h, s, v){
  const c = v * s;
  const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
  const m = v - c;
  let r, g, b;
  if(h < 60){ r = c; g = x; b = 0; }
  else if(h < 120){ r = x; g = c; b = 0; }
  else if(h < 180){ r = 0; g = c; b = x; }
  else if(h < 240){ r = 0; g = x; b = c; }
  else if(h < 300){ r = x; g = 0; b = c; }
  else { r = c; g = 0; b = x; }
  return [
    Math.round((r + m) * 255),
    Math.round((g + m) * 255),
    Math.round((b + m) * 255)
  ];
}

function isSkinPixel(r, g, b){
  const [h, s, v] = rgb2hsv(r, g, b);
  if(v < 0.12) return false;
  if(s < 0.06) return false;
  return (h >= 0 && h <= 50) || (h >= 340 && h <= 360);
}
function isHairPixel(r, g, b){
  const [h, s, v] = rgb2hsv(r, g, b);
  return v > 0.02 && v < 0.45 && s > 0.05;
}

function remapPixel(r, g, b, targetH, targetS, targetV){
  const [h, s, v] = rgb2hsv(r, g, b);
  const newH = targetH;
  const newS = targetS * (0.5 + s * 0.8);
  const newV = v * (0.6 + targetV * 0.6);
  return hsv2rgb(newH, Math.min(1, newS), Math.min(1, newV));
}

function applyPhenotypeToImage(){
  if(!imageLoaded || !originalImageData) return;
  const p = STATE.phenotype;
  if(!p) return;

  const cacheKey = p.skinScore + '_' + p.hairLabel;
  if(skinCache.has(cacheKey)){
    humanImg.src = skinCache.get(cacheKey);
  } else {
    const [th, ts, tv] = rgb2hsv(
      Math.round(p.skinColor[0] * 255),
      Math.round(p.skinColor[1] * 255),
      Math.round(p.skinColor[2] * 255)
    );
    const [hh, hs, hv] = rgb2hsv(
      Math.round(p.hairColor[0] * 255),
      Math.round(p.hairColor[1] * 255),
      Math.round(p.hairColor[2] * 255)
    );

    const src = originalImageData.data;
    const dst = new Uint8ClampedArray(src.length);
    dst.set(src);

    for(let i = 0; i < dst.length; i += 4){
      const r = src[i], g = src[i+1], b = src[i+2], a = src[i+3];
      if(a < 10) continue;
      if(isSkinPixel(r, g, b)){
        const [nr, ng, nb] = remapPixel(r, g, b, th, ts, tv);
        dst[i] = nr; dst[i+1] = ng; dst[i+2] = nb;
      } else if(isHairPixel(r, g, b)){
        const [nr, ng, nb] = remapPixel(r, g, b, hh, Math.max(0.3, hs), hv);
        dst[i] = nr; dst[i+1] = ng; dst[i+2] = nb;
      }
    }

    const c = document.createElement('canvas');
    c.width = originalImageData.width;
    c.height = originalImageData.height;
    c.getContext('2d').putImageData(new ImageData(dst, c.width, c.height), 0, 0);
    const dataUrl = c.toDataURL('image/png');
    skinCache.set(cacheKey, dataUrl);
    humanImg.src = dataUrl;
  }

  const heightScale = p.heightM / 1.7;
  const widthScale = 0.9 + p.bodyType * 0.1;
  humanImg.style.transform = `scaleY(${heightScale}) scaleX(${widthScale})`;
}

/* ============================================================
   5. 场景初始化
   ============================================================ */
function initScene(){
  STATE.fatherGT = GeneEngine.randomIndividual(0.6);
  STATE.motherGT = GeneEngine.randomIndividual(0.6);
  const sperm = GeneEngine.randomGamete(STATE.fatherGT);
  const egg = GeneEngine.randomGamete(STATE.motherGT);
  STATE.zygoteGT = GeneEngine.fertilize(sperm, egg);
  STATE.phenotype = GeneEngine.getPhenotype(STATE.zygoteGT);
  STATE.cells = [{ pos:[0,0,0], type:'stem', size:1.8, generation:0 }];
  STATE.stage = 0;
  STATE.divisions = 0;
  STATE.playing = false;
  STATE.playTimer = 0;
  STATE.animT = 0;
  updateStageDisplay();
  updateUI();
  updateGenePanel();
}

function updateStageDisplay(){
  const stage = STATE.stage;
  if(stage >= 5){
    cellCanvas.style.display = 'none';
    imgWrap.classList.add('show');
    applyPhenotypeToImage();
  } else {
    cellCanvas.style.display = 'block';
    imgWrap.classList.remove('show');
  }
}

/* ============================================================
   6. 基因面板
   ============================================================ */

    { title:'性别', items:[

      { name:'瞳色', gt:'—', pt:p.eyeLabel, color:rgbStr(p.eyeColor) },
      { name:'眼睑', gt:STATE.zygoteGT.EYELID.join(''), pt:p.lidLabel },

    ]},
    { title:'身高', items:[
      { name:'HT1', gt:STATE.zygoteGT.HT1.join(''), pt:'—' },
      { name:'HT2', gt:STATE.zygoteGT.HT2.join(''), pt:'—' },
      { name:'HT3', gt:STATE.zygoteGT.HT3.join(''), pt:'—' },
      { name:'身高', gt:'得分'+p.heightScore+'/6', pt:p.heightLabel }
    ]},
    { title:'体型', items:[
      { name:'BODY', gt:STATE.zygoteGT.BODY.join(''), pt:p.bodyLabel },
      { name:'MUSC', gt:STATE.zygoteGT.MUSC.join(''), pt:p.muscleLabel },
      { name:'SHOULDER', gt:STATE.zygoteGT.SHOULDER.join(''), pt:p.shoulderLabel },
      { name:'LEG', gt:STATE.zygoteGT.LEG.join(''), pt:p.legLabel }
    ]},
    { title:'面部', items:[
      { name:'FACE', gt:STATE.zygoteGT.FACE.join(''), pt:p.faceLabel },
      { name:'NOSE', gt:STATE.zygoteGT.NOSE.join(''), pt:p.noseLabel },
      { name:'LIP', gt:STATE.zygoteGT.LIP.join(''), pt:p.lipLabel },
      { name:'BROW', gt:STATE.zygoteGT.BROW.join(''), pt:p.browLabel },
      { name:'EAR', gt:STATE.zygoteGT.EAR.join(''), pt:p.earLabel },

    for(const it of g.items){

      html += `<div class="gene-row">
        <span class="name">${it.name}</span>

        <span class="pt">${swatch}${it.pt}</span>

    }
  }
  list.innerHTML = html;
}
function rgbStr(c){ return `rgb(${Math.round(c[0]*255)},${Math.round(c[1]*255)},${Math.round(c[2]*255)})`; }

/* ============================================================
   7. 分裂 & 阶段
   ============================================================ */
function doDivision(){
  if(STATE.cells.length >= MAX_CELLS){ STATE.divisions++; return; }
  const newCells = [];
  for(const cell of STATE.cells){
    if(newCells.length + 1 >= MAX_CELLS){ newCells.push(cell); continue; }
    for(const s of [-1, 1]){
      if(newCells.length >= MAX_CELLS) break;
      const dx = (Math.random() - 0.5) * 0.6 + cell.pos[0] * 0.3;
      const dy = (Math.random() - 0.5) * 0.6 + cell.pos[1] * 0.3;
      const dz = (Math.random() - 0.5) * 0.6 + cell.pos[2] * 0.3;
      newCells.push({
        pos: [cell.pos[0] + dx*0.4, cell.pos[1] + dy*0.4, cell.pos[2] + dz*0.4],
        type: cell.type,
        size: cell.size * 0.9,
        generation: cell.generation + 1
      });
    }
  }
  STATE.cells = newCells;
  STATE.divisions++;
}
function advanceStage(){
  if(STATE.stage >= STAGES.length-1) return;
  STATE.stage++;
  const target = STAGES[STATE.stage].div;
  const todo = Math.max(1, Math.min(3, target - STATE.divisions));
  for(let i=0;i<todo;i++) doDivision();
  const stage = STATE.stage;
  for(let i=0;i<STATE.cells.length;i++){
    const cell = STATE.cells[i];
    if(stage <= 2) cell.type = 'stem';
    else if(stage <= 4) cell.type = i%3===0 ? 'ectoderm' : (i%3===1 ? 'mesoderm' : 'endoderm');
    else {
      const y = cell.pos[1];
      if(y > 1) cell.type = 'neuron';
      else if(y > 0.3) cell.type = i%2===0 ? 'heart' : 'lung';
      else if(y > -0.3) cell.type = i%2===0 ? 'liver' : 'stomach';
      else if(y > -1) cell.type = i%2===0 ? 'intestine' : 'kidney';
      else cell.type = 'muscle';
    }
    cell.size = Math.max(0.3, cell.size * 0.92);
  }
  updateStageDisplay();
  updateUI();
  showTitle(STAGES[STATE.stage].name);
}
function resetAll(){ initScene(); showTitle('重新随机基因'); }

/* ============================================================
   8. UI
   ============================================================ */
function updateUI(){
  const p = STATE.phenotype;
  document.getElementById('statSex').textContent = p.sexLabel;
  document.getElementById('statHeight').textContent = p.heightLabel;
  document.getElementById('statStage').textContent = STAGES[STATE.stage].name;
  document.querySelectorAll('.stage-node').forEach((n,i)=>{
    n.classList.toggle('active', i === STATE.stage);
    n.classList.toggle('done', i < STATE.stage);
  });
  const pct = Math.round(STATE.stage / (STAGES.length-1) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = pct + '%';
  document.getElementById('btnPlay').textContent = STATE.playing ? '⏸ 暂停' : '▶ 播放发育';
  document.getElementById('btnStep').disabled = STATE.stage >= STAGES.length-1;
}
function showTitle(text){
  const t = document.getElementById('stageTitle');
  t.textContent = text;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 1100);
}

/* ============================================================
   9. 事件
   ============================================================ */
document.getElementById('btnPlay').addEventListener('click', ()=>{ STATE.playing = !STATE.playing; updateUI(); });
document.getElementById('btnStep').addEventListener('click', advanceStage);
document.getElementById('btnReset').addEventListener('click', resetAll);
document.querySelectorAll('.stage-node').forEach(n=>{
  n.addEventListener('click', ()=>{
    const target = parseInt(n.dataset.stage);
    while(STATE.stage < target) advanceStage();
  });
});

/* ============================================================
   10. F5 切换 UI
   ============================================================ */
const UI_SELECTORS = ['#topBar','#genePanel','#timeline','#f5Badge','#loadInfo'];
const uiHint = document.getElementById('uiHint');
let uiHidden = false;
function toggleUI(){
  uiHidden = !uiHidden;
  UI_SELECTORS.forEach(sel => {
    const el = document.querySelector(sel);
    if(el) el.classList.toggle('ui-hidden', uiHidden);
  });
  uiHint.textContent = uiHidden ? 'UI 已隐藏 · 再按 F5 显示' : 'UI 已显示';
  uiHint.classList.add('show');
  setTimeout(()=> uiHint.classList.remove('show'), uiHidden ? 1800 : 1200);
}
window.addEventListener('keydown', e => {
  if(e.key === 'F5' || e.keyCode === 116){ e.preventDefault(); toggleUI(); }
});

/* ============================================================
   11. 渲染循环
   ============================================================ */
function frame(time){
  time = time || 0;
  const dt = Math.min(50, time - STATE.lastFrameTime);
  STATE.lastFrameTime = time;

  if(!cam.dragging && cam.autoRotate) cam.yaw += 0.0003 * (dt || 16);

  if(STATE.playing){
    STATE.playTimer += dt;
    if(STATE.playTimer > 900){
      STATE.playTimer = 0;
      advanceStage();
      if(STATE.stage >= STAGES.length-1) STATE.playing = false;
      updateUI();
    }
  }

  if(STATE.stage <= 4){
    drawCellCluster();
  }

  requestAnimationFrame(frame);
}

/* ============================================================
   12. 启动
   ============================================================ */
initScene();
requestAnimationFrame(frame);

})();
